<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" width="1400" height="1400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c1e"/>
      <stop offset="40%" stop-color="#0f1b3b"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#f6d365"/>
      <stop offset="65%" stop-color="#fda085"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Luxury Navy Background -->
  <rect width="1400" height="1400" fill="url(#bg)"/>

  <!-- Precision Technical Grid -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1.5">
    <line x1="140" y1="0" x2="140" y2="1400"/>
    <line x1="700" y1="0" x2="700" y2="1400"/>
    <line x1="1260" y1="0" x2="1260" y2="1400"/>
    <line x1="0" y1="140" x2="1400" y2="140"/>
    <line x1="0" y1="700" x2="1400" y2="700"/>
    <line x1="0" y1="1260" x2="1400" y2="1260"/>
  </g>

  <!-- Concentric Radar Rings -->
  <circle cx="700" cy="580" r="380" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.25"/>
  <circle cx="700" cy="580" r="340" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.15" stroke-dasharray="10 10"/>
  <circle cx="700" cy="580" r="280" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>

  <!-- Modern Monogram Emblem -->
  <g transform="translate(700, 480)">
    <polygon points="0,-110 95,-55 95,55 0,110 -95,55 -95,-55" fill="#0d1833" stroke="url(#gold)" stroke-width="4.5" filter="url(#glow)"/>
    <text x="0" y="28" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="78" font-weight="900" fill="url(#gold)" text-anchor="middle" letter-spacing="4">GC</text>
  </g>

  <!-- Header Category -->
  <text x="700" y="740" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="34" font-weight="600" fill="#718096" text-anchor="middle" letter-spacing="14">SHERATON EXECUTIVE LOUNGE</text>
  
  <!-- Main Title -->
  <text x="700" y="840" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="88" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="8">GRAND CENTRAL</text>
  
  <!-- Gradient Accent Line -->
  <line x1="480" y1="895" x2="920" y2="895" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

  <!-- Subtitle -->
  <text x="700" y="975" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="52" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="6">VOICE CASTING STUDIO</text>
  <text x="700" y="1045" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="28" font-weight="500" fill="#a0aec0" text-anchor="middle" letter-spacing="4">PRIVATE INTELLIGENCE FOR COMMUTE</text>

  <!-- Badge at bottom -->
  <rect x="420" y="1130" width="560" height="68" rx="34" fill="#ffffff" fill-opacity="0.07" stroke="url(#gold)" stroke-width="1.8"/>
  <text x="700" y="1174" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">FEAT. 窪田等 ✕ サロン首脳陣</text>
</svg>